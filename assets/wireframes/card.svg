<!-- ✅ SVG for Project Card Example -->
<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="400" height="300" fill="#F5F5F5" stroke="#000000" stroke-width="1"/>
  <!-- Project Title -->
  <text x="20" y="40" font-family="Space Grotesk" font-size="24" fill="#111111">Project Title</text>
  <!-- Description -->
  <text x="20" y="80" font-family="Inter" font-size="16" fill="#333333">Short project description goes here.</text>
  <!-- Tags -->
  <text x="20" y="120" font-family="Inter" font-size="14" fill="#00C6A2">React | Next.js</text>
  <!-- CTA Button -->
  <rect x="20" y="200" width="150" height="40" rx="6" fill="#00C6A2"/>
  <text x="40" y="225" font-family="Inter" font-size="16" fill="#FFFFFF">View Project</text>
</svg> 
 <!-- The SVG above is a simple wireframe for a project card. It includes a title, description, tags, and a call-to-action button. 
 The SVG is 400px wide and 300px tall. The background is a light gray color (#F5F5F5) with a black border. The project title is in a bold font (Space Grotesk) and the description is in a regular font (Inter). The tags are in a smaller font size and a teal color (#00C6A2). The call-to-action button is a teal rectangle with white text. 
 This wireframe can be used as a template for designing project cards on a website or portfolio. You can customize the colors, fonts, and layout to match your design preferences. 
  -->